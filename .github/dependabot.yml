version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      expo:
        patterns:
          - "expo*"
          - "@expo/*"
          - "@expo-google-fonts/*"
      react-native:
        patterns:
          - "react-native*"
          - "@react-native*"
    open-pull-requests-limit: 10
    # Expo SDK majors have to move as one unit (`npx expo install --fix`,
    # which also pins react-native, react and the native modules). Dependabot
    # can only bump these packages separately, so a major PR leaves the SDK
    # half-upgraded and breaks the build (PR #61 did). Patch and minor
    # updates still flow; do SDK upgrades by hand.
    ignore:
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/metro-runtime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "babel-preset-expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
