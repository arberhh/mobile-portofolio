name: EAS preview pipeline

on:
  push:
    branches: [main]

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview update (via EAS Workflow)
        run: |
          eas workflow:run .eas/workflows/publish-preview-update.yml \
            --non-interactive \
            --wait \
            --json > /tmp/workflow-run-output.json
          cat /tmp/workflow-run-output.json
