name: EAS preview pipeline

on:
  push:
    branches: [main]

# Needed so the job can push the README/QR change back to main.
permissions:
  contents: write

jobs:
  publish-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Set build label
        run: echo "BUILD_LABEL=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Publish preview update (via EAS Workflow)
        run: |
          eas workflow:run .eas/workflows/publish-preview-update.yml \
            --non-interactive \
            --wait \
            --json > /tmp/workflow-run-output.json
          cat /tmp/workflow-run-output.json

      - name: Update README with the new build link
        run: node .github/scripts/publish-update-readme.js /tmp/workflow-run-output.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/latest-build-qr.png
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update Expo Go build link for ${BUILD_LABEL}"
          git push origin HEAD:main
