name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npx --yes audit-ci@7.1.0 --config audit-ci.jsonc

      - name: Type check
        run: npm run ts:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test -- --ci

      - name: Web build
        run: npx expo export --platform web

      - name: Dead code / unused exports / unused deps
        run: npm run deadcode
